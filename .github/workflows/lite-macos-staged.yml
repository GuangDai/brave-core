name: Brave Lite macOS staged build

on:
  workflow_call:
    inputs:
      resume_run_id:
        type: string
        default: ''
      resume_stage:
        type: string
        default: '0'
      resume_attempt:
        type: string
        default: '1'
      resume_source_commit:
        type: string
        default: ''
      upgrade_checkpoint_source:
        type: boolean
        default: false
      rescue_cache:
        type: string
        default: ''
      start_phase:
        type: string
        default: '5'
      shards_run_id:
        type: string
        default: ''
      shards_attempt:
        type: string
        default: ''
      seed_run_id:
        type: string
        default: ''
      seed_attempt:
        type: string
        default: '1'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Run ID containing a checkpoint from the same commit
        type: string
        default: ''
      resume_stage:
        description: Checkpoint stage (0 starts from scratch, otherwise 1–8)
        type: string
        default: '0'
      resume_attempt:
        description: Attempt that uploaded the checkpoint
        type: string
        default: '1'
      resume_source_commit:
        description: Source commit recorded in the checkpoint, if the workflow has changed
        type: string
        default: ''
      upgrade_checkpoint_source:
        description: Upgrade a restored checkpoint to the workflow commit using the reviewed patch migration
        type: boolean
        default: false
      rescue_cache:
        description: Extra cache in RUN_ID:SHARD:ATTEMPT or RUN_ID:STAGE:SHARD:ATTEMPT format
        type: string
        default: ''
      start_phase:
        description: Initial target phase (1–8) or shared for assembly
        type: string
        default: '5'
      shards_run_id:
        description: Existing shard run ID (reuse caches or resume from another run)
        type: string
        default: ''
      shards_attempt:
        description: Existing shard attempt (defaults to checkpoint attempt or 1)
        type: string
        default: ''
      seed_run_id:
        description: Earlier single-cache run to seed each parallel shard (up to 1 GiB per shard)
        type: string
        default: ''
      seed_attempt:
        description: Attempt of the earlier single-cache run
        type: string
        default: '1'
permissions:
  actions: read
  contents: read

jobs:
  shards:
    if: inputs.shards_run_id == '' && inputs.resume_stage == '0' && inputs.start_phase != 'shared'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1'
            target: v8:v8
          - shard: '2'
            target: third_party/blink/renderer/core:core
          - shard: '3'
            target: third_party/blink/renderer/modules:modules
          - shard: '4'
            target: content/browser:browser
          - shard: '5'
            target: chrome/browser:browser
    uses: ./.github/workflows/lite-macos-shard.yml
    with:
      shard: ${{ matrix.shard }}
      target: ${{ matrix.target }}
      seed_run_id: ${{ inputs.seed_run_id || '' }}
      seed_attempt: ${{ inputs.seed_attempt || '1' }}

  stage1:
    needs: shards
    if: always() && (needs.shards.result == 'success' || needs.shards.result == 'failure' || (needs.shards.result == 'skipped' && (inputs.shards_run_id != '' || (inputs.resume_stage != '' && inputs.resume_stage != '0'))))
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 1
      restore_stage: ${{ inputs.resume_stage || '0' }}
      restore_run_id: ${{ inputs.resume_run_id || format('{0}', github.run_id) }}
      restore_attempt: ${{ inputs.resume_attempt || '1' }}
      checkpoint_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      start_phase: ${{ inputs.start_phase || '5' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage2:
    needs: stage1
    if: needs.stage1.result == 'success' && needs.stage1.outputs.outcome == 'checkpoint' && (needs.stage1.outputs.reason == 'time' || needs.stage1.outputs.reason == 'next' || needs.stage1.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 2
      restore_stage: '1'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage1.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage3:
    needs: stage2
    if: needs.stage2.result == 'success' && needs.stage2.outputs.outcome == 'checkpoint' && (needs.stage2.outputs.reason == 'time' || needs.stage2.outputs.reason == 'next' || needs.stage2.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 3
      restore_stage: '2'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage2.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage4:
    needs: stage3
    if: needs.stage3.result == 'success' && needs.stage3.outputs.outcome == 'checkpoint' && (needs.stage3.outputs.reason == 'time' || needs.stage3.outputs.reason == 'next' || needs.stage3.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 4
      restore_stage: '3'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage3.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage5:
    needs: stage4
    if: needs.stage4.result == 'success' && needs.stage4.outputs.outcome == 'checkpoint' && (needs.stage4.outputs.reason == 'time' || needs.stage4.outputs.reason == 'next' || needs.stage4.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 5
      restore_stage: '4'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage4.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage6:
    needs: stage5
    if: needs.stage5.result == 'success' && needs.stage5.outputs.outcome == 'checkpoint' && (needs.stage5.outputs.reason == 'time' || needs.stage5.outputs.reason == 'next' || needs.stage5.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 6
      restore_stage: '5'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage5.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage7:
    needs: stage6
    if: needs.stage6.result == 'success' && needs.stage6.outputs.outcome == 'checkpoint' && (needs.stage6.outputs.reason == 'time' || needs.stage6.outputs.reason == 'next' || needs.stage6.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 7
      restore_stage: '6'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage6.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  stage8:
    needs: stage7
    if: needs.stage7.result == 'success' && needs.stage7.outputs.outcome == 'checkpoint' && (needs.stage7.outputs.reason == 'time' || needs.stage7.outputs.reason == 'next' || needs.stage7.outputs.reason == 'cache')
    uses: ./.github/workflows/lite-macos-stage.yml
    with:
      stage: 8
      restore_stage: '7'
      restore_run_id: ${{ format('{0}', github.run_id) }}
      restore_attempt: ${{ needs.stage7.outputs.attempt }}
      source_commit: ${{ (inputs.upgrade_checkpoint_source && github.sha) || inputs.resume_source_commit || github.sha }}
      cache_source_commit: ${{ inputs.resume_source_commit || github.sha }}
      rescue_cache: ${{ inputs.rescue_cache || '' }}
      shared_mode: ${{ inputs.start_phase == 'shared' && 'assembly' || 'normal' }}
      shards_run_id: ${{ inputs.shards_run_id || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_run_id) || format('{0}', github.run_id) }}
      shards_attempt: ${{ (inputs.shards_run_id != '' && (inputs.shards_attempt || '1')) || (inputs.resume_stage != '' && inputs.resume_stage != '0' && inputs.resume_attempt) || format('{0}', github.run_attempt) }}

  result:
    needs: [stage1, stage2, stage3, stage4, stage5, stage6, stage7, stage8]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULT_1: ${{ needs.stage1.result }}
      RESULT_2: ${{ needs.stage2.result }}
      RESULT_3: ${{ needs.stage3.result }}
      RESULT_4: ${{ needs.stage4.result }}
      RESULT_5: ${{ needs.stage5.result }}
      RESULT_6: ${{ needs.stage6.result }}
      RESULT_7: ${{ needs.stage7.result }}
      RESULT_8: ${{ needs.stage8.result }}
      OUTCOME_1: ${{ needs.stage1.outputs.outcome }}
      OUTCOME_2: ${{ needs.stage2.outputs.outcome }}
      OUTCOME_3: ${{ needs.stage3.outputs.outcome }}
      OUTCOME_4: ${{ needs.stage4.outputs.outcome }}
      OUTCOME_5: ${{ needs.stage5.outputs.outcome }}
      OUTCOME_6: ${{ needs.stage6.outputs.outcome }}
      OUTCOME_7: ${{ needs.stage7.outputs.outcome }}
      OUTCOME_8: ${{ needs.stage8.outputs.outcome }}
    steps:
      - name: Require a verified browser artifact
        shell: bash
        run: |
          for stage in {1..8}; do
            result="RESULT_$stage"
            outcome="OUTCOME_$stage"
            if [[ "${!result}" == success && "${!outcome}" == complete ]]; then
              exit 0
            fi
          done
          echo '::error::No stage completed and verified the browser; inspect the stage logs and checkpoints.'
          exit 1
