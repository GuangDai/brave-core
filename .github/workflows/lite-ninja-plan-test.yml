name: Inspect macOS browser build graph

on:
  push:
    branches: [ci/ninja-partition]
    paths:
      - .github/workflows/lite-ninja-plan-test.yml
      - build/ci/lite_generate_graph.js
      - build/ci/lite_export_graph.py
      - build/ci/lite_partition_graph.py
      - build/ci/lite_partition_graph_test.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      pnpm_config_fetch_retries: '6'
      pnpm_config_fetch_retry_mintimeout: '10000'
      pnpm_config_fetch_retry_maxtimeout: '60000'
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/brave
          fetch-depth: 128
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Set up pnpm
        run: npm install --global pnpm@11.11.0

      - name: Initialize Chromium
        working-directory: src/brave
        run: pnpm run init --no-history --target_arch=arm64

      - name: Generate the browser graph without compiling
        working-directory: src/brave
        run: node build/ci/lite_generate_graph.js

      - name: Export the generated graph
        working-directory: src/brave
        run: |
          python3 build/ci/lite_export_graph.py \
            --build "$GITHUB_WORKSPACE/src/out/Static_arm64" \
            --output "$RUNNER_TEMP/lite-graph/browser-ninja.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: lite-browser-ninja-graph
          path: ${{ runner.temp }}/lite-graph/browser-ninja.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  analyze:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: lite-browser-ninja-graph
          path: ${{ runner.temp }}/lite-graph

      - name: Install verified Ninja
        run: |
          curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip -o "$RUNNER_TEMP/ninja.zip"
          echo '5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  '"$RUNNER_TEMP/ninja.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lite-ninja" "$RUNNER_TEMP/lite-build"
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/lite-ninja"
          zstd -d -q -c "$RUNNER_TEMP/lite-graph/browser-ninja.tar.zst" | tar -C "$RUNNER_TEMP/lite-build" -xf -

      - name: Test the partitioner
        run: python3 build/ci/lite_partition_graph_test.py -v

      - name: Compare partitions without compiling
        run: |
          python3 build/ci/lite_partition_graph.py \
            --ninja "$RUNNER_TEMP/lite-ninja/ninja" \
            --build "$RUNNER_TEMP/lite-build" \
            --report "$RUNNER_TEMP/lite-graph-report/metrics.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-browser-build-graph-metrics
          path: ${{ runner.temp }}/lite-graph-report/
          if-no-files-found: warn
          retention-days: 90
