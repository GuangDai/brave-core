name: macOS translation compiler diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ci/translation-clang-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that the fixture matches the translation patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixture = Path('build/ci/lite_translation_clang_fixture.cc').read_text()
          prefs = Path('patches/components-translate-core-browser-translate_prefs.cc.patch').read_text()
          manager = Path('patches/components-translate-core-browser-translate_manager.cc.patch').read_text()
          statements = [line[1:].strip() for line in prefs.splitlines() if line.startswith('+  return ')]
          assert len(statements) == 2
          assert all(fixture.count(statement) == 1 for statement in statements)
          statement = 'if (BUILDFLAG(IS_MAC)) return;'
          assert manager.count('+' + '  ' + statement) == 2
          assert fixture.count(statement) == 2
          PY
      - name: Compile translation condition fixture
        run: |
          clang++ --version
          clang++ -std=c++23 -Wall -Wextra -Wunreachable-code -Wunreachable-code-aggressive -Werror -fsyntax-only build/ci/lite_translation_clang_fixture.cc
      - name: Check that the failing form triggers the warning
        run: |
          cat > "$RUNNER_TEMP/translate-positive-control.cc" <<'EOF'
          #define BUILDFLAG(flag) 1
          struct Prefs { bool GetBoolean(int) const; };
          bool broken(const Prefs* p) {
            return !BUILDFLAG(IS_MAC) && p->GetBoolean(0);
          }
          EOF
          if clang++ -std=c++23 -Wall -Wextra -Wunreachable-code -Wunreachable-code-aggressive -Werror -fsyntax-only "$RUNNER_TEMP/translate-positive-control.cc" 2> "$RUNNER_TEMP/translate-positive-control.log"; then
            echo 'Expected unreachable-code diagnostic was not emitted.'
            exit 1
          fi
          cat "$RUNNER_TEMP/translate-positive-control.log"
          grep -q 'unreachable-code' "$RUNNER_TEMP/translate-positive-control.log"
