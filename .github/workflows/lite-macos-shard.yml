name: macOS compiler cache shard

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      BRAVE_LITE_KEEP_BUILD_OUTPUT: '1'
    steps:
      - name: Start the stage clock
        run: echo "LITE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out Brave Core
        uses: actions/checkout@v4
        with:
          path: src/brave
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Set up pnpm
        run: npm install --global pnpm@11.11.0

      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_REMOTE_ONLY=true' >> "$GITHUB_ENV"
          echo "CCACHE_REMOTE_STORAGE=file:$RUNNER_TEMP/lite-shard/cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/lite-shard/cache"

      - name: Initialize Chromium
        working-directory: src/brave
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          df -h "$GITHUB_WORKSPACE"
          pnpm run init --no-history --target_arch=arm64

      - name: Compile and save cache part 1
        id: part1
        uses: ./src/brave/.github/actions/lite-cache-phase
        with:
          shard: ${{ inputs.shard }}
          target: ${{ inputs.target }}
          part: '1'
          budget: '85'
          cache_limit: '2'

      - name: Compile and save cache part 2
        id: part2
        if: steps.part1.outcome == 'success' && steps.part1.outputs.outcome == 'checkpoint' && (steps.part1.outputs.reason == 'time' || steps.part1.outputs.reason == 'cache')
        uses: ./src/brave/.github/actions/lite-cache-phase
        with:
          shard: ${{ inputs.shard }}
          target: ${{ inputs.target }}
          part: '2'
          budget: '135'
          cache_limit: '4'

      - name: Compile and save cache part 3
        id: part3
        if: steps.part2.outcome == 'success' && steps.part2.outputs.outcome == 'checkpoint' && (steps.part2.outputs.reason == 'time' || steps.part2.outputs.reason == 'cache')
        uses: ./src/brave/.github/actions/lite-cache-phase
        with:
          shard: ${{ inputs.shard }}
          target: ${{ inputs.target }}
          part: '3'
          budget: '185'
          cache_limit: '6'

      - name: Compile and save cache part 4
        id: part4
        if: steps.part3.outcome == 'success' && steps.part3.outputs.outcome == 'checkpoint' && (steps.part3.outputs.reason == 'time' || steps.part3.outputs.reason == 'cache')
        uses: ./src/brave/.github/actions/lite-cache-phase
        with:
          shard: ${{ inputs.shard }}
          target: ${{ inputs.target }}
          part: '4'
          budget: '235'
          cache_limit: '8'
