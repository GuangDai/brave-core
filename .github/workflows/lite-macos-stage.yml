name: macOS build stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
      restore_stage:
        required: true
        type: string
      restore_run_id:
        required: true
        type: string
      restore_attempt:
        required: true
        type: string
      shards_run_id:
        required: true
        type: string
      shards_attempt:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      checkpoint_source_commit:
        required: false
        type: string
      cache_source_commit:
        required: false
        type: string
      rescue_cache:
        required: false
        type: string
      start_phase:
        required: false
        default: '5'
        type: string
      shared_mode:
        required: false
        default: normal
        type: string
    outputs:
      outcome:
        value: ${{ jobs.build.outputs.outcome }}
      reason:
        value: ${{ jobs.build.outputs.reason }}
      attempt:
        value: ${{ jobs.build.outputs.attempt }}

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      BRAVE_LITE_KEEP_BUILD_OUTPUT: '1'
      BRAVE_LITE_REUSE_GN: ${{ inputs.restore_stage != '0' && '1' || '0' }}
      LITE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      LITE_CHECKPOINT_SOURCE_COMMIT: ${{ inputs.checkpoint_source_commit || inputs.source_commit }}
      LITE_CACHE_SOURCE_COMMIT: ${{ inputs.cache_source_commit || inputs.source_commit }}
      pnpm_config_fetch_retries: '6'
      pnpm_config_fetch_retry_mintimeout: '10000'
      pnpm_config_fetch_retry_maxtimeout: '60000'
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      reason: ${{ steps.result.outputs.reason }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Start the stage clock
        env:
          RESTORE_STAGE: ${{ inputs.restore_stage }}
        run: |
          [[ "$LITE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LITE_CHECKPOINT_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LITE_CACHE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$LITE_CHECKPOINT_SOURCE_COMMIT" != "$LITE_SOURCE_COMMIT" && ( "$RESTORE_STAGE" == 0 || "$LITE_SOURCE_COMMIT" != "$GITHUB_SHA" ) ]]; then
            echo '::error::Source upgrade requires an existing checkpoint and the workflow commit.'
            exit 1
          fi
          if [[ "$RESTORE_STAGE" == '0' && "$LITE_SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo '::error::A different source commit requires a saved checkpoint.'
            exit 1
          fi
          echo "LITE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the build source
        if: inputs.restore_stage == '0'
        uses: actions/checkout@v4
        with:
          path: src/brave
          ref: ${{ inputs.source_commit }}
          fetch-depth: 128
          persist-credentials: false

      - name: Check out checkpoint tools
        uses: actions/checkout@v4
        with:
          path: .lite-tools
          sparse-checkout: |
            build/ci
            .github/actions/lite-stage-cache-phase
            .github/actions/lite-publish-app
            .github/actions/lite-rescue-cache
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Set up pnpm
        run: npm install --global pnpm@11.11.0

      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"

      - name: Check the macOS SDK and disk
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          df -h "$GITHUB_WORKSPACE"

      - name: Validate checkpoint selection
        if: inputs.restore_stage != '0'
        env:
          RESTORE_STAGE: ${{ inputs.restore_stage }}
          RESTORE_RUN: ${{ inputs.restore_run_id }}
          RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
        run: |
          [[ "$RESTORE_STAGE" =~ ^[1-8]$ ]]
          [[ "$RESTORE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RESTORE_ATTEMPT" =~ ^[0-9]+$ ]]

      - name: Download the checkpoint manifest
        if: inputs.restore_stage != '0'
        uses: actions/download-artifact@v4
        with:
          name: brave-lite-s${{ inputs.restore_stage }}-a${{ inputs.restore_attempt }}-manifest
          path: ${{ runner.temp }}/lite-restore-manifest
          github-token: ${{ github.token }}
          run-id: ${{ inputs.restore_run_id }}

      - name: Stream and verify the checkpoint
        if: inputs.restore_stage != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN: ${{ inputs.restore_run_id }}
          RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
          RESTORE_STAGE: ${{ inputs.restore_stage }}
        run: |
          python3 .lite-tools/build/ci/lite_stream_checkpoint.py \
            --workspace "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/lite-restore-manifest/manifest.json" \
            --repository "$GITHUB_REPOSITORY" --commit "$LITE_CHECKPOINT_SOURCE_COMMIT" \
            --run-id "$RESTORE_RUN" --attempt "$RESTORE_ATTEMPT" --stage "$RESTORE_STAGE"
          test "$(git -C src/brave rev-parse HEAD)" = "$LITE_CHECKPOINT_SOURCE_COMMIT"

      - name: Upgrade the restored checkpoint source
        if: inputs.restore_stage != '0' && inputs.checkpoint_source_commit != '' && inputs.checkpoint_source_commit != inputs.source_commit
        run: |
          python3 .lite-tools/build/ci/lite_checkpoint_upgrade.py \
            --workspace "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --old "$LITE_CHECKPOINT_SOURCE_COMMIT" --new "$LITE_SOURCE_COMMIT"

      - name: Select this stage's target and cache
        id: selection
        env:
          START_PHASE: ${{ inputs.start_phase }}
          RESTORE_STAGE: ${{ inputs.restore_stage }}
          SHARED_MODE: ${{ inputs.shared_mode }}
        shell: bash
        run: |
          ninja_file=''
          case "$SHARED_MODE" in
            bootstrap)
              [[ "$RESTORE_STAGE" != '0' ]]
              phase=5; shard=5; target=brave_lite_shared; ninja_file=brave_lite_shared.ninja ;;
            normal|assembly)
              phase="$START_PHASE"
              if [[ "$RESTORE_STAGE" != '0' ]]; then
                phase=$(python3 .lite-tools/build/ci/lite_stage_phase.py next \
                  --manifest "$RUNNER_TEMP/lite-restore-manifest/manifest.json" \
                  --phase "$RESTORE_STAGE" --mode "$SHARED_MODE")
              elif [[ "$SHARED_MODE" == assembly ]]; then
                echo '::error::Shared assembly requires a completed bootstrap checkpoint.'
                exit 1
              fi
              case "$phase" in
                1) shard=1; target='v8:v8' ;;
                2) shard=2; target='third_party/blink/renderer/core:core' ;;
                3) shard=3; target='third_party/blink/renderer/modules:modules' ;;
                4) shard=4; target='content/browser:browser' ;;
                5) shard=5; target='chrome/browser:browser' ;;
                6) shard=1; target='' ;;
                7) shard=2; target='' ;;
                8) shard=3; target='' ;;
                *) exit 1 ;;
              esac
              if [[ "$SHARED_MODE" == assembly && "$phase" -le 5 ]]; then
                target="brave_lite_group_$phase"
                ninja_file=brave_lite_graph.ninja
              fi ;;
            *) echo '::error::Invalid shared build mode.'; exit 1 ;;
          esac
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "ninja_file=$ninja_file" >> "$GITHUB_OUTPUT"

      - name: Verify restored Siso source overrides
        if: inputs.shared_mode != 'normal'
        run: python3 .lite-tools/build/ci/lite_siso_config_verify.py --src "$GITHUB_WORKSPACE/src"

      - name: Prepare the shared dependency plan
        if: inputs.shared_mode == 'bootstrap'
        shell: bash
        run: |
          build="$GITHUB_WORKSPACE/src/out/Static_arm64"
          test -f "$build/build.ninja"
          if [[ ! -f "$build/brave_lite_shared.ninja" || ! -f "$build/brave_lite_graph.ninja" || ! -f "$build/brave_lite_plan.json" ]]; then
            curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip -o "$RUNNER_TEMP/ninja.zip"
            echo 'c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b  '"$RUNNER_TEMP/ninja.zip" | shasum -a 256 -c -
            mkdir -p "$RUNNER_TEMP/lite-ninja"
            unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/lite-ninja"
            python3 .lite-tools/build/ci/lite_shared_plan.py --ninja "$RUNNER_TEMP/lite-ninja/ninja" \
              --build "$build" --report "$build/brave_lite_plan.json"
          fi

      - name: Check the shared assembly plan
        if: inputs.shared_mode == 'assembly'
        run: |
          test -f "$GITHUB_WORKSPACE/src/out/Static_arm64/brave_lite_graph.ninja"
          test -f "$GITHUB_WORKSPACE/src/out/Static_arm64/brave_lite_partitions.ninja"

      - name: Initialize Chromium
        if: inputs.restore_stage == '0'
        working-directory: src/brave
        run: pnpm run init --no-history --target_arch=arm64

      - name: Test patch application
        if: inputs.restore_stage == '0'
        working-directory: src/brave
        env:
          TMPDIR: ${{ github.workspace }}/src/brave/.ci-patcher-tests
        run: |
          mkdir -p "$TMPDIR"
          pnpm exec jest --runInBand --runTestsByPath build/commands/lib/gitPatcher.test.js

      - name: Verify Siso redirects wrapped compiler commands
        if: inputs.restore_stage == '0'
        working-directory: src/brave
        run: |
          LITE_SISO_TEST_BINARY="$GITHUB_WORKSPACE/src/third_party/siso/cipd/siso" \
          LITE_CCACHE_TEST_BINARY="$(command -v ccache)" \
            python3 build/ci/lite_siso_ccache_test.py -v

      - name: Validate shard selection
        env:
          SHARDS_RUN: ${{ inputs.shards_run_id }}
          SHARDS_ATTEMPT: ${{ inputs.shards_attempt }}
        run: |
          [[ "$SHARDS_RUN" =~ ^[0-9]+$ ]]
          [[ "$SHARDS_ATTEMPT" =~ ^[0-9]+$ ]]

      - name: Download available cache parts
        id: download_parts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: brave-lite-shard-${{ steps.selection.outputs.shard }}-part-*-a${{ inputs.shards_attempt }}
          path: ${{ runner.temp }}/lite-shard-parts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.shards_run_id }}

      - name: Find saved cache parts
        id: parts
        env:
          SHARD: ${{ steps.selection.outputs.shard }}
          ATTEMPT: ${{ inputs.shards_attempt }}
        shell: bash
        run: |
          found=false
          for part in 1 2 3 4; do
            if [[ -f "$RUNNER_TEMP/lite-shard-parts/brave-lite-shard-$SHARD-part-$part-a$ATTEMPT/manifest.json" ]]; then
              found=true
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Validate shared group cache metadata
        if: inputs.shared_mode == 'assembly' && steps.parts.outputs.found == 'true'
        env:
          SHARD: ${{ steps.selection.outputs.shard }}
          ATTEMPT: ${{ inputs.shards_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          env = os.environ
          root = Path(env['RUNNER_TEMP']) / 'lite-shard-parts'
          pattern = f"brave-lite-shard-{env['SHARD']}-part-*-a{env['ATTEMPT']}/manifest.json"
          manifests = list(root.glob(pattern))
          for path in manifests:
              data = json.loads(path.read_text())
              if (data.get('actual_build_target') != f"brave_lite_group_{env['SHARD']}"
                      or data.get('ninja_file') != 'brave_lite_graph.ninja'):
                  raise RuntimeError(f'Incorrect group cache metadata: {path}')
          PY

      - name: Continue without a missing shared group cache
        if: inputs.shared_mode == 'assembly' && steps.parts.outputs.found != 'true'
        run: echo '::warning::No cache from this group is available; its missing outputs will be compiled during assembly.'

      - name: Verify available cache parts
        if: steps.parts.outputs.found == 'true'
        working-directory: src/brave
        env:
          SHARD: ${{ steps.selection.outputs.shard }}
          ATTEMPT: ${{ inputs.shards_attempt }}
        run: |
          GITHUB_ENV="$RUNNER_TEMP/lite-shard-env" python3 build/ci/lite_cache_parts.py verify \
            --root "$RUNNER_TEMP/lite-shard-parts" --workspace "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" --commit "$LITE_CACHE_SOURCE_COMMIT" \
            --attempt "$ATTEMPT" --shard "$SHARD"
          while IFS= read -r line; do
            case "$line" in
              CCACHE_REMOTE_STORAGE=*|CCACHE_REMOTE_ONLY=*) echo "$line" >> "$GITHUB_ENV" ;;
            esac
          done < "$RUNNER_TEMP/lite-shard-env"

      - name: Download a legacy single cache
        id: download_cache
        if: steps.parts.outputs.found != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: brave-lite-shard-${{ steps.selection.outputs.shard }}-a${{ inputs.shards_attempt }}
          path: ${{ runner.temp }}/lite-shards/brave-lite-shard-${{ steps.selection.outputs.shard }}-a${{ inputs.shards_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.shards_run_id }}

      - name: Verify the legacy cache before reuse
        if: steps.parts.outputs.found != 'true' && steps.download_cache.outcome == 'success'
        working-directory: src/brave
        env:
          SHARDS_ATTEMPT: ${{ inputs.shards_attempt }}
          SHARD: ${{ steps.selection.outputs.shard }}
        run: |
          python3 build/ci/lite_shard_cache.py verify-one \
            --root "$RUNNER_TEMP/lite-shards" --workspace "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" --commit "$LITE_CACHE_SOURCE_COMMIT" \
            --attempt "$SHARDS_ATTEMPT" --shard "$SHARD"

      - name: Continue without this missing cache
        if: steps.parts.outputs.found != 'true' && steps.download_cache.outcome != 'success'
        run: |
          echo '::warning::This shard has no saved cache; build output will still be checkpointed.'

      - name: Reuse an additional saved compiler cache
        if: inputs.rescue_cache != ''
        uses: ./.lite-tools/.github/actions/lite-rescue-cache
        with:
          selection: ${{ inputs.rescue_cache }}

      - name: Enable a writable cache for new compiler results
        run: |
          mkdir -p "$RUNNER_TEMP/lite-stage-cache"
          python3 - <<'PY'
          import os
          from pathlib import Path
          env = os.environ
          writable = (Path(env['RUNNER_TEMP']) / 'lite-stage-cache').as_uri()
          backends = ' '.join(filter(None, [env.get('CCACHE_REMOTE_STORAGE', ''), writable]))
          with open(env['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CCACHE_REMOTE_STORAGE={backends}\nCCACHE_REMOTE_ONLY=true\n')
          PY

      - name: Compile and preserve stage cache part 1
        id: part1
        uses: ./.lite-tools/.github/actions/lite-stage-cache-phase
        with:
          stage: ${{ inputs.stage }}
          shard: ${{ steps.selection.outputs.shard }}
          target: ${{ steps.selection.outputs.target }}
          ninja_file: ${{ steps.selection.outputs.ninja_file }}
          part: '1'
          budget: '85'
          cache_limit: '2'

      - name: Compile and preserve stage cache part 2
        id: part2
        if: steps.part1.outputs.outcome == 'checkpoint' && (steps.part1.outputs.reason == 'time' || steps.part1.outputs.reason == 'cache')
        uses: ./.lite-tools/.github/actions/lite-stage-cache-phase
        with:
          stage: ${{ inputs.stage }}
          shard: ${{ steps.selection.outputs.shard }}
          target: ${{ steps.selection.outputs.target }}
          ninja_file: ${{ steps.selection.outputs.ninja_file }}
          part: '2'
          budget: '145'
          cache_limit: '4'

      - name: Compile and preserve stage cache part 3
        id: part3
        if: steps.part2.outputs.outcome == 'checkpoint' && (steps.part2.outputs.reason == 'time' || steps.part2.outputs.reason == 'cache')
        uses: ./.lite-tools/.github/actions/lite-stage-cache-phase
        with:
          stage: ${{ inputs.stage }}
          shard: ${{ steps.selection.outputs.shard }}
          target: ${{ steps.selection.outputs.target }}
          ninja_file: ${{ steps.selection.outputs.ninja_file }}
          part: '3'
          budget: '205'
          cache_limit: '6'

      - name: Compile and preserve stage cache part 4
        id: part4
        if: steps.part3.outputs.outcome == 'checkpoint' && (steps.part3.outputs.reason == 'time' || steps.part3.outputs.reason == 'cache')
        uses: ./.lite-tools/.github/actions/lite-stage-cache-phase
        with:
          stage: ${{ inputs.stage }}
          shard: ${{ steps.selection.outputs.shard }}
          target: ${{ steps.selection.outputs.target }}
          ninja_file: ${{ steps.selection.outputs.ninja_file }}
          part: '4'
          budget: '265'
          cache_limit: '8'

      - name: Determine the next stage
        id: result
        if: always() && steps.part1.outcome != '' && steps.part1.outcome != 'skipped'
        shell: bash
        env:
          LITE_BUILD_TARGET: ${{ steps.selection.outputs.target }}
          OUTCOME_1: ${{ steps.part1.outputs.outcome }}
          OUTCOME_2: ${{ steps.part2.outputs.outcome }}
          OUTCOME_3: ${{ steps.part3.outputs.outcome }}
          OUTCOME_4: ${{ steps.part4.outputs.outcome }}
          REASON_1: ${{ steps.part1.outputs.reason }}
          REASON_2: ${{ steps.part2.outputs.reason }}
          REASON_3: ${{ steps.part3.outputs.reason }}
          REASON_4: ${{ steps.part4.outputs.reason }}
          STATUS_1: ${{ steps.part1.outcome }}
          STATUS_2: ${{ steps.part2.outcome }}
          STATUS_3: ${{ steps.part3.outcome }}
          STATUS_4: ${{ steps.part4.outcome }}
        run: python3 .lite-tools/build/ci/lite_stage_result.py

      - name: Verify and preserve the app
        if: steps.result.outputs.outcome == 'complete'
        uses: ./.lite-tools/.github/actions/lite-publish-app
        with:
          stage: ${{ inputs.stage }}

      - name: Save build checkpoint
        id: checkpoint
        if: always() && (steps.result.outputs.outcome == 'checkpoint' || steps.result.outputs.outcome == 'complete' || steps.result.outputs.compile_outcome == 'failed')
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        working-directory: src/brave
        run: |
          checkpoint_tool=build/ci/lite_checkpoint.py
          if [[ -f "$GITHUB_WORKSPACE/.lite-tools/build/ci/lite_checkpoint.py" ]]; then
            checkpoint_tool="$GITHUB_WORKSPACE/.lite-tools/build/ci/lite_checkpoint.py"
          fi
          python3 "$checkpoint_tool" save \
            --workspace "$GITHUB_WORKSPACE" \
            --checkpoint "$RUNNER_TEMP/lite-checkpoint" \
            --repository "$GITHUB_REPOSITORY" --commit "$LITE_SOURCE_COMMIT"

      - name: Record the completed build phase
        id: checkpoint_phase
        if: always() && steps.checkpoint.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        env:
          LITE_BUILD_PHASE: ${{ steps.selection.outputs.phase }}
          LITE_PHASE_COMPLETE: ${{ steps.result.outputs.compile_outcome == 'complete' && 'true' || 'false' }}
          LITE_PHASE_MODE: ${{ inputs.shared_mode }}
        run: |
          phase_tool=src/brave/build/ci/lite_stage_phase.py
          if [[ -f .lite-tools/build/ci/lite_stage_phase.py ]]; then
            phase_tool=.lite-tools/build/ci/lite_stage_phase.py
          fi
          python3 "$phase_tool" record --manifest "$RUNNER_TEMP/lite-checkpoint/manifest.json" \
            --phase "$LITE_BUILD_PHASE" --complete "$LITE_PHASE_COMPLETE" --mode "$LITE_PHASE_MODE"

      - name: Upload checkpoint manifest
        id: upload_checkpoint_manifest
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-manifest
          path: ${{ runner.temp }}/lite-checkpoint/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload checkpoint part aa
        id: upload_checkpoint_aa
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-aa
          path: ${{ runner.temp }}/lite-checkpoint/part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ab
        id: upload_checkpoint_ab
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ab
          path: ${{ runner.temp }}/lite-checkpoint/part-ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ac
        id: upload_checkpoint_ac
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ac
          path: ${{ runner.temp }}/lite-checkpoint/part-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ad
        id: upload_checkpoint_ad
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ad
          path: ${{ runner.temp }}/lite-checkpoint/part-ad
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ae
        id: upload_checkpoint_ae
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ae
          path: ${{ runner.temp }}/lite-checkpoint/part-ae
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part af
        id: upload_checkpoint_af
        if: always() && steps.checkpoint_phase.outcome == 'success'
        continue-on-error: ${{ steps.result.outputs.outcome == 'complete' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-af
          path: ${{ runner.temp }}/lite-checkpoint/part-af
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ag
        id: upload_checkpoint_ag
