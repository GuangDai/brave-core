name: macOS build stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
      restore_stage:
        required: true
        type: string
      restore_run_id:
        required: true
        type: string
      restore_attempt:
        required: true
        type: string
      shards_run_id:
        required: true
        type: string
      shards_attempt:
        required: true
        type: string
    outputs:
      outcome:
        value: ${{ jobs.build.outputs.outcome }}
      reason:
        value: ${{ jobs.build.outputs.reason }}
      attempt:
        value: ${{ jobs.build.outputs.attempt }}

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      BRAVE_LITE_KEEP_BUILD_OUTPUT: '1'
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      reason: ${{ steps.result.outputs.reason }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Start the stage clock
        run: echo "LITE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Select this stage's target and cache
        id: selection
        env:
          STAGE: ${{ inputs.stage }}
        shell: bash
        run: |
          case "$STAGE" in
            1) shard=1; target='v8:v8' ;;
            2) shard=2; target='third_party/blink/renderer/core:core' ;;
            3) shard=3; target='third_party/blink/renderer/modules:modules' ;;
            4) shard=4; target='content/browser:browser' ;;
            5) shard=5; target='chrome/browser:browser' ;;
            6) shard=1; target='' ;;
            7) shard=2; target='' ;;
            8) shard=3; target='' ;;
            *) exit 1 ;;
          esac
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Check out the build source
        if: inputs.restore_stage == '0'
        uses: actions/checkout@v4
        with:
          path: src/brave
          fetch-depth: 1
          persist-credentials: false

      - name: Check out checkpoint tools
        if: inputs.restore_stage != '0'
        uses: actions/checkout@v4
        with:
          path: .lite-tools
          sparse-checkout: build/ci
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Set up pnpm
        run: npm install --global pnpm@11.11.0

      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"

      - name: Check the macOS SDK and disk
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          df -h "$GITHUB_WORKSPACE"

      - name: Validate checkpoint selection
        if: inputs.restore_stage != '0'
        env:
          RESTORE_STAGE: ${{ inputs.restore_stage }}
          RESTORE_RUN: ${{ inputs.restore_run_id }}
          RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
        run: |
          [[ "$RESTORE_STAGE" =~ ^[1-8]$ ]]
          [[ "$RESTORE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RESTORE_ATTEMPT" =~ ^[0-9]+$ ]]

      - name: Download checkpoint volumes
        if: inputs.restore_stage != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: brave-lite-s${{ inputs.restore_stage }}-a${{ inputs.restore_attempt }}-*
          path: ${{ runner.temp }}/lite-restore
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.restore_run_id }}

      - name: Verify and restore checkpoint
        if: inputs.restore_stage != '0'
        run: |
          python3 .lite-tools/build/ci/lite_checkpoint.py restore \
            --workspace "$GITHUB_WORKSPACE" \
            --checkpoint "$RUNNER_TEMP/lite-restore" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          test "$(git -C src/brave rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install build dependencies
        if: inputs.restore_stage == '0'
        working-directory: src/brave
        run: pnpm install --frozen-lockfile --yes

      - name: Test patch application
        if: inputs.restore_stage == '0'
        working-directory: src/brave
        env:
          TMPDIR: ${{ github.workspace }}/src/brave/.ci-patcher-tests
        run: |
          mkdir -p "$TMPDIR"
          pnpm exec jest --runInBand --runTestsByPath build/commands/lib/gitPatcher.test.js

      - name: Initialize Chromium
        if: inputs.restore_stage == '0'
        working-directory: src/brave
        run: pnpm run init --no-history --target_arch=arm64

      - name: Validate shard selection
        env:
          SHARDS_RUN: ${{ inputs.shards_run_id }}
          SHARDS_ATTEMPT: ${{ inputs.shards_attempt }}
        run: |
          [[ "$SHARDS_RUN" =~ ^[0-9]+$ ]]
          [[ "$SHARDS_ATTEMPT" =~ ^[0-9]+$ ]]

      - name: Download available cache parts
        id: download_parts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: brave-lite-shard-${{ steps.selection.outputs.shard }}-part-*-a${{ inputs.shards_attempt }}
          path: ${{ runner.temp }}/lite-shard-parts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.shards_run_id }}

      - name: Find saved cache parts
        id: parts
        env:
          SHARD: ${{ steps.selection.outputs.shard }}
          ATTEMPT: ${{ inputs.shards_attempt }}
        shell: bash
        run: |
          found=false
          for part in 1 2 3 4; do
            if [[ -f "$RUNNER_TEMP/lite-shard-parts/brave-lite-shard-$SHARD-part-$part-a$ATTEMPT/manifest.json" ]]; then
              found=true
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Verify available cache parts
        if: steps.parts.outputs.found == 'true'
        working-directory: src/brave
        env:
          SHARD: ${{ steps.selection.outputs.shard }}
          ATTEMPT: ${{ inputs.shards_attempt }}
        run: |
          python3 build/ci/lite_cache_parts.py verify \
            --root "$RUNNER_TEMP/lite-shard-parts" --workspace "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --attempt "$ATTEMPT" --shard "$SHARD"

      - name: Download a legacy single cache
        id: download_cache
        if: steps.parts.outputs.found != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: brave-lite-shard-${{ steps.selection.outputs.shard }}-a${{ inputs.shards_attempt }}
          path: ${{ runner.temp }}/lite-shards/brave-lite-shard-${{ steps.selection.outputs.shard }}-a${{ inputs.shards_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.shards_run_id }}

      - name: Verify the legacy cache before reuse
        if: steps.parts.outputs.found != 'true' && steps.download_cache.outcome == 'success'
        working-directory: src/brave
        env:
          SHARDS_ATTEMPT: ${{ inputs.shards_attempt }}
          SHARD: ${{ steps.selection.outputs.shard }}
        run: |
          python3 build/ci/lite_shard_cache.py verify-one \
            --root "$RUNNER_TEMP/lite-shards" --workspace "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --attempt "$SHARDS_ATTEMPT" --shard "$SHARD"

      - name: Continue without this missing cache
        if: steps.parts.outputs.found != 'true' && steps.download_cache.outcome != 'success'
        run: |
          echo '::warning::This shard has no saved cache; build output will still be checkpointed.'
          echo 'CCACHE_DISABLE=true' >> "$GITHUB_ENV"

      - name: Compile until the stage deadline
        id: compile
        working-directory: src/brave
        shell: bash
        env:
          TARGET: ${{ steps.selection.outputs.target }}
        run: |
          args=(pnpm run build Static --target_arch=arm64 --skip_signing)
          if [[ -n "$TARGET" ]]; then args+=(--target="$TARGET"); fi
          python3 build/ci/lite_timebox.py \
            --workspace "$GITHUB_WORKSPACE" --started "$LITE_JOB_STARTED" \
            -- "${args[@]}" \
            --gn=symbol_level:0 --gn=cc_wrapper:ccache \
            --gn=enable_brave_wallet:false \
            --gn=enable_brave_rewards:false \
            --gn=enable_brave_vpn_v1:false \
            --gn=enable_brave_vpn_v2:false \
            --gn=enable_ai_chat:false

      - name: Report compiler cache usage
        if: always() && steps.compile.outputs.outcome != ''
        run: ccache --show-stats -v

      - name: Determine the next stage
        id: result
        if: always() && steps.compile.outputs.outcome != ''
        shell: bash
        env:
          TARGET: ${{ steps.selection.outputs.target }}
          OUTCOME: ${{ steps.compile.outputs.outcome }}
          REASON: ${{ steps.compile.outputs.reason }}
        run: |
          if [[ -n "$TARGET" && "$OUTCOME" == complete ]]; then
            echo 'outcome=checkpoint' >> "$GITHUB_OUTPUT"
            echo 'reason=next' >> "$GITHUB_OUTPUT"
          else
            echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          fi

      - name: Save build checkpoint
        id: checkpoint
        if: always() && (steps.result.outputs.outcome == 'checkpoint' || steps.compile.outcome == 'failure')
        working-directory: src/brave
        run: |
          python3 build/ci/lite_checkpoint.py save \
            --workspace "$GITHUB_WORKSPACE" \
            --checkpoint "$RUNNER_TEMP/lite-checkpoint" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Upload checkpoint manifest
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-manifest
          path: ${{ runner.temp }}/lite-checkpoint/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload checkpoint part aa
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-aa
          path: ${{ runner.temp }}/lite-checkpoint/part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ab
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ab
          path: ${{ runner.temp }}/lite-checkpoint/part-ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ac
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ac
          path: ${{ runner.temp }}/lite-checkpoint/part-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ad
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ad
          path: ${{ runner.temp }}/lite-checkpoint/part-ad
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ae
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ae
          path: ${{ runner.temp }}/lite-checkpoint/part-ae
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part af
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-af
          path: ${{ runner.temp }}/lite-checkpoint/part-af
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ag
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ag
          path: ${{ runner.temp }}/lite-checkpoint/part-ag
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Upload checkpoint part ah
        if: always() && steps.checkpoint.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-s${{ inputs.stage }}-a${{ github.run_attempt }}-part-ah
          path: ${{ runner.temp }}/lite-checkpoint/part-ah
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90

      - name: Verify the browser
        if: steps.result.outputs.outcome == 'complete'
        working-directory: src/brave
        run: |
          python3 build/ci/lite_verify_build.py \
            --build "$GITHUB_WORKSPACE/src/out/Static_arm64" \
            --profile "$RUNNER_TEMP/lite-smoke-profile"

      - name: Package the app
        if: steps.result.outputs.outcome == 'complete'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "$GITHUB_WORKSPACE/src/out/Static_arm64" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Brave-Lite-macOS-arm64.zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 Brave-Lite-macOS-arm64.zip > SHA256SUMS.txt)

      - name: Upload the app
        if: steps.result.outputs.outcome == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: Brave-Lite-macOS-arm64-stage-${{ inputs.stage }}
          path: |
            ${{ runner.temp }}/Brave-Lite-macOS-arm64.zip
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Report disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/src/out" 2>/dev/null || true
