name: Experimental macOS browser feature verification

on:
  push:
    branches: [ci/browser-verification]
    paths: [.github/workflows/lite-browser-verification.yml]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: Run containing a complete app or prior browser-verification checkpoint
        required: true
        type: string
      restore_stage:
        description: Checkpoint stage number
        required: true
        type: string
      restore_attempt:
        description: Checkpoint run attempt
        type: string
        default: '1'
      source_commit:
        description: Original app source commit recorded in the checkpoint
        required: true
        type: string
      checkpoint_namespace:
        description: App checkpoint or isolated browser-verification checkpoint
        type: choice
        options: [brave-lite, brave-lite-verify]
        default: brave-lite
      translation_overlay:
        description: Apply the pinned translation and password-test overlay to source 794c9cb
        type: boolean
        default: false
      rescue_cache:
        description: Optional extra compiler cache selection
        type: string
        default: ''
      verification_cache_run_id:
        description: Optional earlier browser-verification cache run ID
        type: string
        default: ''
      verification_cache_attempt:
        description: Earlier browser-verification cache attempt
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Verification workflow registered; no browser build started.'

  build_and_test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 355
    env:
      BRAVE_LITE_KEEP_BUILD_OUTPUT: '1'
      BRAVE_LITE_REUSE_GN: '1'
      LITE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      pnpm_config_fetch_retries: '6'
      pnpm_config_fetch_retry_mintimeout: '10000'
      pnpm_config_fetch_retry_maxtimeout: '60000'
    steps:
      - name: Start clock and validate selection
        env:
          RESTORE_RUN: ${{ inputs.restore_run_id }}
          RESTORE_STAGE: ${{ inputs.restore_stage }}
          RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
        run: |
          [[ "$RESTORE_RUN" =~ ^[0-9]+$ && "$RESTORE_STAGE" =~ ^[1-8]$ && "$RESTORE_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$LITE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "LITE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out isolated verification tools
        uses: actions/checkout@v4
        with:
          path: .lite-tools
          sparse-checkout: |
            build/ci
            .github/lite-testing
            .github/actions/lite-browser-test-cache
            .github/actions/lite-browser-test-cache-restore
            .github/actions/lite-rescue-cache
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Set up pnpm and verified ccache
        run: |
          npm install --global pnpm@11.11.0
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
      - name: Download checkpoint manifest
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_namespace }}-s${{ inputs.restore_stage }}-a${{ inputs.restore_attempt }}-manifest
          path: ${{ runner.temp }}/restore-manifest
          github-token: ${{ github.token }}
          run-id: ${{ inputs.restore_run_id }}
      - name: Restore verified checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN: ${{ inputs.restore_run_id }}
          RESTORE_STAGE: ${{ inputs.restore_stage }}
          RESTORE_ATTEMPT: ${{ inputs.restore_attempt }}
          NAMESPACE: ${{ inputs.checkpoint_namespace }}
        run: |
          python3 .lite-tools/build/ci/lite_stream_checkpoint.py \
            --workspace "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/restore-manifest/manifest.json" \
            --repository "$GITHUB_REPOSITORY" --commit "$LITE_SOURCE_COMMIT" \
            --run-id "$RESTORE_RUN" --attempt "$RESTORE_ATTEMPT" --stage "$RESTORE_STAGE" --namespace "$NAMESPACE"
          [[ "$(git -C src/brave rev-parse HEAD)" == "$LITE_SOURCE_COMMIT" ]]
      - name: Validate app and prepare optional test-only overlay
        env:
          OVERLAY: ${{ inputs.translation_overlay && 'true' || 'false' }}
          NAMESPACE: ${{ inputs.checkpoint_namespace }}
        run: |
          mkdir -p "$RUNNER_TEMP/browser-verification"
          python3 .lite-tools/build/ci/lite_browser_checkpoint.py prepare \
            --workspace "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/restore-manifest/manifest.json" \
            --source "$LITE_SOURCE_COMMIT" --overlay "$OVERLAY" --namespace "$NAMESPACE" \
            --patch "$GITHUB_WORKSPACE/.lite-tools/.github/lite-testing/translation-tests.patch.b64" \
            --provenance "$RUNNER_TEMP/browser-verification/provenance.json"
      - name: Reuse an optional compiler cache
        if: inputs.rescue_cache != ''
        uses: ./.lite-tools/.github/actions/lite-rescue-cache
        with:
          selection: ${{ inputs.rescue_cache }}
      - name: Reuse an optional browser-verification cache
        if: inputs.checkpoint_namespace == 'brave-lite-verify' || inputs.verification_cache_run_id != ''
        uses: ./.lite-tools/.github/actions/lite-browser-test-cache-restore
        with:
          run_id: ${{ inputs.verification_cache_run_id || inputs.restore_run_id }}
          attempt: ${{ inputs.verification_cache_attempt || inputs.restore_attempt }}
      - name: Enable a separate writable compiler cache
        run: |
          mkdir -p "$RUNNER_TEMP/lite-stage-cache"
          python3 - <<'PY'
          import os
          from pathlib import Path
          env = os.environ
          writable = (Path(env['RUNNER_TEMP']) / 'lite-stage-cache').as_uri()
          backends = ' '.join(filter(None, [env.get('CCACHE_REMOTE_STORAGE', ''), writable]))
          with open(env['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CCACHE_REMOTE_STORAGE={backends}\nCCACHE_REMOTE_ONLY=true\n')
          PY
      - name: Compile and save browser-test cache part 1
        id: part1
        uses: ./.lite-tools/.github/actions/lite-browser-test-cache
        with:
          stage: '1'
          shard: '5'
          target: brave_browser_tests
          part: '1'
          budget: '85'
          cache_limit: '2'
      - name: Compile and save browser-test cache part 2
        id: part2
        if: steps.part1.outputs.outcome == 'checkpoint' && (steps.part1.outputs.reason == 'time' || steps.part1.outputs.reason == 'cache')
        uses: ./.lite-tools/.github/actions/lite-browser-test-cache
        with:
          stage: '1'
          shard: '5'
          target: brave_browser_tests
          part: '2'
          budget: '145'
          cache_limit: '4'
      - name: Compile and save browser-test cache part 3
        id: part3
        if: steps.part2.outputs.outcome == 'checkpoint' && (steps.part2.outputs.reason == 'time' || steps.part2.outputs.reason == 'cache')
        uses: ./.lite-tools/.github/actions/lite-browser-test-cache
        with:
          stage: '1'
          shard: '5'
          target: brave_browser_tests
          part: '3'
          budget: '205'
          cache_limit: '6'
      - name: Compile and save browser-test cache part 4
        id: part4
        if: steps.part3.outputs.outcome == 'checkpoint' && (steps.part3.outputs.reason == 'time' || steps.part3.outputs.reason == 'cache')
        uses: ./.lite-tools/.github/actions/lite-browser-test-cache
        with:
          stage: '1'
          shard: '5'
          target: brave_browser_tests
          part: '4'
          budget: '265'
          cache_limit: '8'
      - name: Summarize test compilation
        id: result
        if: always() && steps.part1.outcome != '' && steps.part1.outcome != 'skipped'
        env:
          LITE_BUILD_TARGET: brave_browser_tests
          OUTCOME_1: ${{ steps.part1.outputs.outcome }}
          OUTCOME_2: ${{ steps.part2.outputs.outcome }}
          OUTCOME_3: ${{ steps.part3.outputs.outcome }}
          OUTCOME_4: ${{ steps.part4.outputs.outcome }}
          REASON_1: ${{ steps.part1.outputs.reason }}
          REASON_2: ${{ steps.part2.outputs.reason }}
          REASON_3: ${{ steps.part3.outputs.reason }}
          REASON_4: ${{ steps.part4.outputs.reason }}
          STATUS_1: ${{ steps.part1.outcome }}
          STATUS_2: ${{ steps.part2.outcome }}
          STATUS_3: ${{ steps.part3.outcome }}
          STATUS_4: ${{ steps.part4.outcome }}
        run: python3 .lite-tools/build/ci/lite_stage_result.py
      - name: Ensure app executable stayed unchanged
        id: app_check
        if: steps.result.outputs.compile_outcome == 'complete'
        continue-on-error: true
        run: |
          python3 .lite-tools/build/ci/lite_browser_checkpoint.py check-app \
            --workspace "$GITHUB_WORKSPACE" --provenance "$RUNNER_TEMP/browser-verification/provenance.json"
      - name: List and run exact browser tests
        id: tests
        if: steps.result.outputs.compile_outcome == 'complete' && steps.app_check.outcome == 'success'
        continue-on-error: true
        env:
          OVERLAY: ${{ inputs.translation_overlay && 'true' || 'false' }}
        shell: bash
        run: |
          args=(--binary "$GITHUB_WORKSPACE/src/out/Static_arm64/brave_browser_tests" --output "$RUNNER_TEMP/browser-verification/results")
          if [[ "$OVERLAY" == true ]]; then args+=(--translation-overlay); fi
          set +e
          python3 .lite-tools/build/ci/lite_browser_verify.py "${args[@]}" > "$RUNNER_TEMP/browser-verification/controller.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/browser-verification/controller.log"
          exit "$status"
      - name: Record browser test result checksums
        id: report
        if: always() && steps.result.outcome == 'success'
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.result.outputs.compile_outcome }}
          REASON: ${{ steps.result.outputs.reason }}
          APP_CHECK: ${{ steps.app_check.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: |
          python3 .lite-tools/build/ci/lite_browser_report.py --root "$RUNNER_TEMP/browser-verification" \
            --compile-outcome "$OUTCOME" --reason "$REASON" --app-check "$APP_CHECK" --test-status "$TEST_STATUS"
      - name: Upload browser test results and provenance
        if: always() && steps.result.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-browser-test-results-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-verification/
          if-no-files-found: error
          retention-days: 90
      - name: Save isolated browser-test checkpoint
        id: checkpoint
        if: always() && steps.result.outcome == 'success'
        continue-on-error: true
        run: |
          python3 .lite-tools/build/ci/lite_checkpoint.py save --workspace "$GITHUB_WORKSPACE" \
            --checkpoint "$RUNNER_TEMP/verify-checkpoint" --repository "$GITHUB_REPOSITORY" --commit "$LITE_SOURCE_COMMIT"
      - name: Record test checkpoint provenance
        id: record
        if: always() && steps.checkpoint.outcome == 'success'
        env:
          OUTCOME: ${{ steps.result.outputs.compile_outcome }}
          REASON: ${{ steps.result.outputs.reason }}
        run: |
          python3 .lite-tools/build/ci/lite_browser_checkpoint.py record \
            --manifest "$RUNNER_TEMP/verify-checkpoint/manifest.json" \
            --provenance "$RUNNER_TEMP/browser-verification/provenance.json" --outcome "$OUTCOME" --reason "$REASON"
      - name: Upload isolated checkpoint manifest
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-manifest
          path: ${{ runner.temp }}/verify-checkpoint/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload isolated checkpoint part aa
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-aa
          path: ${{ runner.temp }}/verify-checkpoint/part-aa
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ab
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ab
          path: ${{ runner.temp }}/verify-checkpoint/part-ab
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ac
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ac
          path: ${{ runner.temp }}/verify-checkpoint/part-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ad
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ad
          path: ${{ runner.temp }}/verify-checkpoint/part-ad
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ae
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ae
          path: ${{ runner.temp }}/verify-checkpoint/part-ae
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part af
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-af
          path: ${{ runner.temp }}/verify-checkpoint/part-af
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ag
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ag
          path: ${{ runner.temp }}/verify-checkpoint/part-ag
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ah
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ah
          path: ${{ runner.temp }}/verify-checkpoint/part-ah
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ai
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ai
          path: ${{ runner.temp }}/verify-checkpoint/part-ai
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part aj
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-aj
          path: ${{ runner.temp }}/verify-checkpoint/part-aj
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ak
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ak
          path: ${{ runner.temp }}/verify-checkpoint/part-ak
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part al
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-al
          path: ${{ runner.temp }}/verify-checkpoint/part-al
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part am
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-am
          path: ${{ runner.temp }}/verify-checkpoint/part-am
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part an
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-an
          path: ${{ runner.temp }}/verify-checkpoint/part-an
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ao
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ao
          path: ${{ runner.temp }}/verify-checkpoint/part-ao
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Upload isolated checkpoint part ap
        if: always() && steps.record.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-verify-s1-a${{ github.run_attempt }}-part-ap
          path: ${{ runner.temp }}/verify-checkpoint/part-ap
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 90
      - name: Report unavailable test checkpoint
        if: always() && steps.result.outcome == 'success' && steps.record.outcome != 'success'
        run: echo '::warning::The isolated test checkpoint could not be saved; uploaded cache parts remain available.'
      - name: Report incomplete or failed browser verification
        if: always() && (steps.result.outcome != 'success' || steps.result.outputs.compile_outcome != 'complete' || steps.app_check.outcome != 'success' || steps.tests.outcome != 'success' || steps.report.outcome != 'success')
        run: |
          echo '::error::Browser verification did not complete; inspect the saved test logs and cache parts.'
          exit 1
