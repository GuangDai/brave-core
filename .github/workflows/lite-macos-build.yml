name: Brave Lite macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      CCACHE_DIR: ${{ github.workspace }}/.brave-ccache
      CCACHE_MAXSIZE: 0
    steps:
      - name: Check out Brave Core
        uses: actions/checkout@v4
        with:
          path: src/brave
          fetch-depth: 128
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Set up pnpm
        run: npm install --global pnpm@11.11.0

      - name: Check the macOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build dependencies
        working-directory: src/brave
        run: pnpm install --frozen-lockfile --yes

      - name: Test the patch application tool
        working-directory: src/brave
        env:
          TMPDIR: ${{ github.workspace }}/src/brave/.ci-patcher-tests
        run: |
          mkdir -p "$TMPDIR"
          pnpm exec jest --runInBand --runTestsByPath build/commands/lib/gitPatcher.test.js

      - name: Initialize a shallow Chromium checkout
        working-directory: src/brave
        run: |
          df -h "$GITHUB_WORKSPACE"
          pnpm run init --no-history --target_arch=arm64

      - name: Install the compiler cache
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.brave-ccache
          key: brave-ccache-arm64-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brave-ccache-arm64-v1-

      - name: Build the browser
        id: compile
        timeout-minutes: 230
        working-directory: src/brave
        run: |
          pnpm run build Static --target_arch=arm64 --skip_signing \
            --gn=symbol_level:0 \
            --gn=cc_wrapper:ccache \
            --gn=use_clang_modules:false --gn=enable_precompiled_headers:false \
            --gn=enable_brave_wallet:false \
            --gn=enable_brave_rewards:false \
            --gn=enable_brave_vpn_v1:false \
            --gn=enable_brave_vpn_v2:false \
            --gn=enable_ai_chat:false

      - name: Report compiler cache usage
        if: always() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        run: ccache --show-stats

      - name: Save compiler cache
        if: always() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.brave-ccache
          key: brave-ccache-arm64-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package the app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "$GITHUB_WORKSPACE/src/out/Static_arm64" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Brave-Lite-macOS-arm64.zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 Brave-Lite-macOS-arm64.zip > SHA256SUMS.txt)

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Brave-Lite-macOS-arm64
          path: |
            ${{ runner.temp }}/Brave-Lite-macOS-arm64.zip
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/src/out" 2>/dev/null || true
