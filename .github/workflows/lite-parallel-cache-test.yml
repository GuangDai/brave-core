name: macOS parallel compiler cache test

on:
  workflow_dispatch:
  push:
    branches: [ci/macos-staged]
    paths: [.github/workflows/lite-parallel-cache-test.yml]

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_REMOTE_ONLY=true' >> "$GITHUB_ENV"
          echo "CCACHE_REMOTE_STORAGE=file:$RUNNER_TEMP/lite-cache" >> "$GITHUB_ENV"

      - name: Compile one independent object
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/lite-cache"
          printf 'int lite_shard_%s(void) { return %s; }\n' "$SHARD" "$SHARD" > "$GITHUB_WORKSPACE/lite-shard-$SHARD.c"
          ccache clang -c "$GITHUB_WORKSPACE/lite-shard-$SHARD.c" -o "$GITHUB_WORKSPACE/lite-shard-$SHARD.o"
          ccache --show-stats -v

      - name: Upload the shard cache
        uses: actions/upload-artifact@v4
        with:
          name: lite-parallel-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/lite-cache/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  reuse:
    needs: compile
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_REMOTE_ONLY=true' >> "$GITHUB_ENV"

      - name: Download all shard caches
        uses: actions/download-artifact@v4
        with:
          pattern: lite-parallel-shard-*
          path: ${{ runner.temp }}/shards

      - name: Read every object from the shard caches
        shell: bash
        run: |
          set -euo pipefail
          backends=''
          for shard in 1 2 3 4 5; do
            backend="$RUNNER_TEMP/shards/lite-parallel-shard-$shard"
            test -d "$backend"
            backends="$backends file:$backend|read-only"
          done
          export CCACHE_REMOTE_STORAGE="${backends# }"
          for shard in 1 2 3 4 5; do
            printf 'int lite_shard_%s(void) { return %s; }\n' "$shard" "$shard" > "$GITHUB_WORKSPACE/lite-shard-$shard.c"
            ccache clang -c "$GITHUB_WORKSPACE/lite-shard-$shard.c" -o "$GITHUB_WORKSPACE/lite-shard-$shard.o"
            nm "$GITHUB_WORKSPACE/lite-shard-$shard.o" | grep "_lite_shard_$shard"
          done
          ccache --show-stats -v
          ccache --print-stats | awk '$1 == "remote_storage_hit" && $2 == 5 { ok=1 } END { exit !ok }'
