name: macOS parallel compiler cache test

on:
  workflow_dispatch:
  push:
    branches: [ci/macos-staged]
    paths: [.github/workflows/lite-parallel-cache-test.yml]

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/brave
          persist-credentials: false
      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_REMOTE_ONLY=true' >> "$GITHUB_ENV"
          echo "CCACHE_REMOTE_STORAGE=file:$RUNNER_TEMP/lite-shard/cache" >> "$GITHUB_ENV"
          echo "LITE_CLANG=$(xcrun --find clang)" >> "$GITHUB_ENV"
          shasum -a 256 "$(xcrun --find clang)"

      - name: Compile one independent object
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/lite-shard/cache"
          printf 'int lite_shard_%s(void) { return %s; }\n' "$SHARD" "$SHARD" > "$GITHUB_WORKSPACE/lite-shard-$SHARD.c"
          ccache "$LITE_CLANG" -c "$GITHUB_WORKSPACE/lite-shard-$SHARD.c" -o "$GITHUB_WORKSPACE/lite-shard-$SHARD.o"
          ccache --show-stats -v

      - name: Record the cache with production validation code
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          target=$(PYTHONPATH=src/brave/build/ci python3 -c 'import os, lite_shard_cache; print(lite_shard_cache.TARGETS[os.environ["SHARD"]])')
          python3 src/brave/build/ci/lite_shard_cache.py save \
            --root "$RUNNER_TEMP/lite-shard" --workspace "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --shard "$SHARD" --target "$target" --outcome complete

      - name: Upload the shard cache
        uses: actions/upload-artifact@v4
        with:
          name: brave-lite-shard-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/lite-shard/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  reuse:
    needs: compile
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/brave
          persist-credentials: false
      - name: Install verified ccache binary
        shell: bash
        run: |
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-darwin.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo 'cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc  '"$RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.2-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-stats" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_REMOTE_ONLY=true' >> "$GITHUB_ENV"
          echo "LITE_CLANG=$(xcrun --find clang)" >> "$GITHUB_ENV"
          shasum -a 256 "$(xcrun --find clang)"

      - name: Download all shard caches
        uses: actions/download-artifact@v4
        with:
          pattern: brave-lite-shard-*-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/shards

      - name: Verify all shard manifests
        run: |
          python3 src/brave/build/ci/lite_shard_cache.py verify-set \
            --root "$RUNNER_TEMP/shards" --workspace "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Read every object from the shard caches
        shell: bash
        run: |
          set -euo pipefail
          for shard in 1 2 3 4 5; do
            printf 'int lite_shard_%s(void) { return %s; }\n' "$shard" "$shard" > "$GITHUB_WORKSPACE/lite-shard-$shard.c"
            ccache "$LITE_CLANG" -c "$GITHUB_WORKSPACE/lite-shard-$shard.c" -o "$GITHUB_WORKSPACE/lite-shard-$shard.o"
            nm "$GITHUB_WORKSPACE/lite-shard-$shard.o" | grep "_lite_shard_$shard"
          done
          ccache --show-stats -v
          ccache --print-stats | awk '$1 == "remote_storage_hit" && $2 == 5 { ok=1 } END { exit !ok }'
