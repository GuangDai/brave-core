name: macOS checkpoint handoff test

on:
  workflow_dispatch:
  push:
    branches: [ci/macos-staged]
    paths:
      - build/ci/lite_checkpoint.py
      - build/ci/lite_checkpoint_test.py
      - build/ci/lite_timebox.py
      - build/ci/lite_timebox_test.py
      - build/ci/lite_shard_cache.py
      - build/ci/lite_shard_cache_test.py
      - build/ci/lite_interrupted_build_test.js
      - build/commands/lib/interruptedBuild.js
      - .github/workflows/lite-checkpoint-test.yml

permissions:
  contents: read

jobs:
  save:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test checkpoint validation
        run: |
          python3 build/ci/lite_checkpoint_test.py -v
          python3 build/ci/lite_timebox_test.py -v
          python3 build/ci/lite_shard_cache_test.py -v
          node --test build/ci/lite_interrupted_build_test.js
      - name: Save a checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fixture/executable"
          chmod 755 "$RUNNER_TEMP/fixture/executable"
          ln -s executable "$RUNNER_TEMP/fixture/alias"
          python3 build/ci/lite_checkpoint.py save \
            --workspace "$RUNNER_TEMP/fixture" \
            --checkpoint "$RUNNER_TEMP/checkpoint" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-fixture
          path: ${{ runner.temp }}/checkpoint/
          if-no-files-found: error
          retention-days: 1

  restore:
    needs: save
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-fixture
          path: ${{ runner.temp }}/checkpoint
      - name: Restore and verify the checkpoint
        run: |
          python3 build/ci/lite_checkpoint.py restore \
            --workspace "$RUNNER_TEMP/fixture" \
            --checkpoint "$RUNNER_TEMP/checkpoint" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          test -x "$RUNNER_TEMP/fixture/executable"
          test "$(readlink "$RUNNER_TEMP/fixture/alias")" = executable
          "$RUNNER_TEMP/fixture/executable"
