name: Compile and preserve one stage cache part
description: Save newly compiled results before continuing the same stage.

inputs:
  stage:
    required: true
    description: Stage number
  shard:
    required: true
    description: Shard number used by this stage
  target:
    required: false
    default: ''
    description: Optional Ninja target
  ninja_file:
    required: false
    default: ''
    description: Optional generated shared-build Ninja file
  artifact_scope:
    required: false
    default: stage
    description: Stage or parallel shard cache naming
  part:
    required: true
    description: Cache part number
  budget:
    required: true
    description: Deadline in minutes from job start
  cache_limit:
    required: true
    description: Total writable cache limit in GiB
outputs:
  outcome:
    value: ${{ steps.compile.outputs.outcome || (steps.compile.outcome == 'failure' && 'failed') }}
    description: Complete, checkpoint or failed
  reason:
    value: ${{ steps.compile.outputs.reason }}
    description: Reason for a checkpoint
  cache_saved:
    value: ${{ (steps.upload.outcome == 'success' || steps.retry.outcome == 'success') && 'true' || 'false' }}
    description: Whether the current cache part was uploaded

runs:
  using: composite
  steps:
    - name: Compile until the next cache checkpoint
      id: compile
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.workspace }}/src/brave
      env:
        LITE_BUILD_TARGET: ${{ inputs.target }}
        LITE_NINJA_FILE: ${{ inputs.ninja_file }}
        PART: ${{ inputs.part }}
        BUDGET: ${{ inputs.budget }}
        CACHE_LIMIT: ${{ inputs.cache_limit }}
      run: |
        if [[ "$PART" != 1 ]]; then export BRAVE_LITE_REUSE_GN=1; fi
        args=(pnpm run build Static --target_arch=arm64 --skip_signing)
        if [[ -n "$LITE_BUILD_TARGET" ]]; then args+=(--target="$LITE_BUILD_TARGET"); fi
        if [[ -n "$LITE_NINJA_FILE" ]]; then
          [[ "$LITE_NINJA_FILE" == brave_lite_shared.ninja || "$LITE_NINJA_FILE" == brave_lite_graph.ninja ]]
          args+=(--ninja="f:$LITE_NINJA_FILE")
        fi
        python3 build/ci/lite_timebox.py \
          --workspace "$GITHUB_WORKSPACE" --started "$LITE_JOB_STARTED" \
          --budget-minutes "$BUDGET" --cache-dir "$RUNNER_TEMP/lite-stage-cache" \
          --cache-limit-gib "$CACHE_LIMIT" -- "${args[@]}" \
          --gn=symbol_level:0 --gn=cc_wrapper:ccache \
          --gn=use_clang_modules:false --gn=enable_precompiled_headers:false \
          --gn=enable_brave_wallet:false --gn=enable_brave_rewards:false \
          --gn=enable_brave_vpn_v1:false --gn=enable_brave_vpn_v2:false \
          --gn=enable_ai_chat:false

    - name: Report compiler cache usage
      if: always() && (steps.compile.outputs.outcome != '' || steps.compile.outcome == 'failure')
      shell: bash
      run: ccache --show-stats -v

    - name: Record this cache part
      id: manifest
      if: always() && (steps.compile.outputs.outcome != '' || steps.compile.outcome == 'failure')
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.workspace }}/src/brave
      env:
        SHARD: ${{ inputs.shard }}
        PART: ${{ inputs.part }}
        OUTCOME: ${{ steps.compile.outputs.outcome || (steps.compile.outcome == 'failure' && 'failed') }}
        REASON: ${{ steps.compile.outputs.reason }}
        ACTUAL_TARGET: ${{ inputs.target }}
        NINJA_FILE: ${{ inputs.ninja_file }}
      run: |
        if [[ -f "$RUNNER_TEMP/lite-stage-cache-state.json" ]]; then
          cp "$RUNNER_TEMP/lite-stage-cache-state.json" "$RUNNER_TEMP/lite-stage-cache-state-$PART.json"
        fi
        python3 build/ci/lite_cache_parts.py save \
          --cache "$RUNNER_TEMP/lite-stage-cache" --stage "$RUNNER_TEMP/lite-stage-cache-part-$PART" \
          --state "$RUNNER_TEMP/lite-stage-cache-state-$PART.json" \
          --workspace "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
          --commit "$LITE_SOURCE_COMMIT" --shard "$SHARD" --part "$PART" \
          --outcome "$OUTCOME" --reason "$REASON"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        env = os.environ
        path = Path(env['RUNNER_TEMP']) / f"lite-stage-cache-part-{env['PART']}" / 'manifest.json'
        data = json.loads(path.read_text())
        data['actual_build_target'] = env['ACTUAL_TARGET'] or 'brave'
        data['ninja_file'] = env['NINJA_FILE'] or 'build.ninja'
        path.write_text(json.dumps(data, separators=(',', ':')) + '\n')
        PY

    - name: Name this cache artifact
      id: name
      shell: bash
      env:
        SCOPE: ${{ inputs.artifact_scope }}
        STAGE: ${{ inputs.stage }}
        SHARD: ${{ inputs.shard }}
        PART: ${{ inputs.part }}
      run: |
        case "$SCOPE" in
          stage) name="brave-lite-stage-$STAGE-shard-$SHARD-part-$PART-a$GITHUB_RUN_ATTEMPT" ;;
          shard) name="brave-lite-shard-$SHARD-part-$PART-a$GITHUB_RUN_ATTEMPT" ;;
          *) echo '::error::Invalid cache artifact scope.'; exit 1 ;;
        esac
        echo "value=$name" >> "$GITHUB_OUTPUT"

    - name: Upload this cache part
      id: upload
      if: always() && steps.manifest.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.name.outputs.value }}
        path: ${{ runner.temp }}/lite-stage-cache-part-${{ inputs.part }}/
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
        retention-days: 90

    - name: Retry this cache part once
      id: retry
      if: always() && steps.manifest.outcome == 'success' && steps.upload.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.name.outputs.value }}
        path: ${{ runner.temp }}/lite-stage-cache-part-${{ inputs.part }}/
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
        retention-days: 90

    - name: Commit the uploaded cache state
      if: always() && (steps.upload.outcome == 'success' || steps.retry.outcome == 'success')
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: mv "$RUNNER_TEMP/lite-stage-cache-state-$PART.json" "$RUNNER_TEMP/lite-stage-cache-state.json"

    - name: Report an unavailable cache part
      if: always() && (steps.compile.outputs.outcome != '' || steps.compile.outcome == 'failure') && steps.upload.outcome != 'success' && steps.retry.outcome != 'success'
      shell: bash
      run: echo '::warning::This cache part could not be uploaded; the next part will retry its entries.'
