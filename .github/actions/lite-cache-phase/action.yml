name: Compile and save one cache part
description: Time-box a target and upload newly cached compiler results.

inputs:
  shard:
    required: true
    description: Shard number
  target:
    required: true
    description: Ninja target
  part:
    required: true
    description: Part number
  budget:
    required: true
    description: Deadline in minutes from job start
  cache_limit:
    required: true
    description: Total cache size limit in GiB
outputs:
  outcome:
    value: ${{ steps.compile.outputs.outcome }}
    description: Complete, checkpoint or failed
  reason:
    value: ${{ steps.compile.outputs.reason }}
    description: Reason for a checkpoint

runs:
  using: composite
  steps:
    - name: Compile until the next cache checkpoint
      id: compile
      shell: bash
      working-directory: ${{ github.workspace }}/src/brave
      env:
        TARGET: ${{ inputs.target }}
        BUDGET: ${{ inputs.budget }}
        CACHE_LIMIT: ${{ inputs.cache_limit }}
      run: |
        python3 build/ci/lite_timebox.py \
          --workspace "$GITHUB_WORKSPACE" --started "$LITE_JOB_STARTED" \
          --budget-minutes "$BUDGET" --reserve-gib 18 \
          --cache-dir "$RUNNER_TEMP/lite-shard/cache" --cache-limit-gib "$CACHE_LIMIT" \
          -- pnpm run build Static --target_arch=arm64 --skip_signing \
          --target="$TARGET" --gn=symbol_level:0 --gn=cc_wrapper:ccache \
          --gn=enable_brave_wallet:false \
          --gn=enable_brave_rewards:false \
          --gn=enable_brave_vpn_v1:false \
          --gn=enable_brave_vpn_v2:false \
          --gn=enable_ai_chat:false

    - name: Report compiler cache usage
      if: always() && steps.compile.outputs.outcome != ''
      shell: bash
      run: ccache --show-stats -v

    - name: Record this cache part
      id: manifest
      if: always() && steps.compile.outputs.outcome != ''
      shell: bash
      working-directory: ${{ github.workspace }}/src/brave
      env:
        SHARD: ${{ inputs.shard }}
        PART: ${{ inputs.part }}
        OUTCOME: ${{ steps.compile.outputs.outcome }}
        REASON: ${{ steps.compile.outputs.reason }}
      run: |
        python3 build/ci/lite_cache_parts.py save \
          --cache "$RUNNER_TEMP/lite-shard/cache" \
          --stage "$RUNNER_TEMP/lite-parts/part-$PART" \
          --state "$RUNNER_TEMP/lite-shard-state.json" \
          --workspace "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
          --commit "$GITHUB_SHA" --shard "$SHARD" --part "$PART" \
          --outcome "$OUTCOME" --reason "$REASON"

    - name: Upload this cache part
      if: always() && steps.manifest.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: brave-lite-shard-${{ inputs.shard }}-part-${{ inputs.part }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/lite-parts/part-${{ inputs.part }}/
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
        retention-days: 90
